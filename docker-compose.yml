services:
  db:
    image: postgres:17
    container_name: king-arena-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: king_arena
      POSTGRES_USER: arena_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - arena_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_app -d king_arena"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arena_postgres_data: